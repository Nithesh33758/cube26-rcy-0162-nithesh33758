spring.application.name=recovery-manager-backend
server.port=${PORT:${SERVER_PORT:8081}}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/recovery_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

recovery-manager.default-org-id=${DEFAULT_ORG_ID:org_demo_alpha}
recovery-manager.cors.allowed-origins=${FRONTEND_ORIGINS:http://127.0.0.1:3000,http://localhost:3000}
recovery-manager.ai.local.url=${LOCAL_AI_URL:http://127.0.0.1:8000/v1/analyze-unit}


recovery-manager.evidence.contract.base-url=${EVIDENCE_SERVICE_BASE_URL:}
recovery-manager.evidence.contract.authentication-type=${EVIDENCE_SERVICE_AUTH_TYPE:}
recovery-manager.evidence.contract.authentication-token=${EVIDENCE_SERVICE_AUTH_TOKEN:}
recovery-manager.evidence.contract.authentication-header-name=${EVIDENCE_SERVICE_AUTH_HEADER_NAME:}
recovery-manager.evidence.contract.cursor-request-parameter=${EVIDENCE_SERVICE_CURSOR_PARAMETER:}
recovery-manager.evidence.contract.organization-ids.org_demo_alpha=${EVIDENCE_ORG_DEMO_ALPHA_UUID:}
recovery-manager.evidence.contract.organization-ids.org_demo_bravo=${EVIDENCE_ORG_DEMO_BRAVO_UUID:}
