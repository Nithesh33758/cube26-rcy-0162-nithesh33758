spring.application.name=recovery-manager-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/recovery_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:recovery_app}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

recovery-manager.default-org-id=${DEFAULT_ORG_ID:org_demo_alpha}
recovery-manager.cors.allowed-origins=${FRONTEND_ORIGINS:http://127.0.0.1:3000,http://localhost:3000}
recovery-manager.ai.gemini.api-key=${GEMINI_API_KEY:}
recovery-manager.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
