# Test configuration: uses H2 in-memory database instead of PostgreSQL
# so tests can run without a live database.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

recovery-manager.default-org-id=org_demo_alpha
recovery-manager.cors.allowed-origins=http://127.0.0.1:3000,http://localhost:3000
recovery-manager.ai.local.url=http://127.0.0.1:8000/v1/analyze-unit
